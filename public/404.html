<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vibhav Kamat</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load of e.g.
      /musings/some-post 404s. This redirects to index.html with the real
      path stashed in the query string; index.html's inline script (see
      below) restores it via history.replaceState before React Router
      ever sees a mismatch. Standard "spa-github-pages" technique.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
